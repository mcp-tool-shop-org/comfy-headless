name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  # The site is built on pull requests too, not only on the push that deploys
  # it. Until 2026-09-17 it was not, and that gap took main red: Dependabot
  # #56 bumped @astrojs/starlight to 0.42.1, Starlight 0.39 had removed
  # autogenerated sidebar groups carrying a `label`, and site/astro.config.mjs
  # still used that shape. lint / test / Pip Audit / Secret Scanning all
  # passed because none of them build the site, so the failure first showed up
  # on the deploy, after main already had it (run 35265878409).
  #
  # Paths-gated here, unlike ci.yml's PR trigger, for the inverse reason: this
  # workflow is not a required check, so a filter cannot strand a PR behind a
  # check that never reports -- it just stays quiet when no site file moved.
  # Cost is one job (~1 billable minute) on PRs touching site/**, none on the
  # rest.
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Scoped per job: building needs no write scope, so a PR-triggered run
    # never carries pages:write or id-token:write. Only deploy asks.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build site
        working-directory: site
        run: npm run build

      # A PR run is a build check, not a deployment -- nothing consumes the
      # artifact, so skip the upload rather than pay for it.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    needs: build
    # main is the only source of the published site. A PR proves the build,
    # it never publishes.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
