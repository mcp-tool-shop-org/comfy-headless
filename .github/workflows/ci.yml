# --- Measured CI cost (dogfood-swarm SKILL item 8) --------------------------
# 13 billable min per push across 5 jobs (10.3 min actual wall time),
# measured 2026-09-07 from run 34124782600. Most expensive jobs:
#     5 min  test (3.11)  (4.4 min wall)
#     5 min  test (3.12)  (4.7 min wall)
#     1 min  Pip Audit  (0.7 min wall)
# GitHub bills per JOB, rounded UP to the minute, x2 Windows / x10 macOS, so
# billable minutes exceed wall time - many short jobs cost more than one long
# one. This number is measured, never estimated; re-measure after any change:
#   gh api repos/mcp-tool-shop-org/comfy-headless/actions/runs/<id>/jobs
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [main]
    paths:
      - 'pyproject.toml'
      - 'comfy_headless/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'atlas/**'
      - 'codecov.yml'
  # Deliberately NOT paths-gated. main requires lint / test (3.11) / test (3.12) /
  # Pip Audit / Secret Scanning, and a required check that never runs never
  # reports -- so a docs-only PR (README, translations, handbook) sat at
  # MERGEABLE / BLOCKED forever with zero checks. Push stays gated below, which
  # is where the repeated minute cost actually lives; PR time is exactly when
  # the gate is wanted.
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          # Pinned: an unpinned lint tool makes CI non-reproducible. A newer
          # ruff began formatting Python inside markdown fences, which turned
          # 16 pre-existing docs into a surprise CI failure on an unrelated PR.
          pip install ruff==0.15.17 mypy

      - name: Run ruff
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run type checking
        run: mypy comfy_headless
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    env:
      # 'true' on the one cell whose coverage and test results go to Codecov:
      # the lowest supported Python, on a pull request or a push to the
      # default branch.
      COVERAGE_LEG: ${{ matrix.python-version == '3.11' && (github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      # The committed Atlas map (atlas/) must match the tree. Atlas needs
      # Node 22 or later, and the map is the same on every cell, so it is
      # checked on the 3.12 cell only.
      - name: Set up Node for Atlas
        if: matrix.python-version == '3.12'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Atlas check
        if: matrix.python-version == '3.12'
        run: npx --yes @dogfood-lab/atlas@1.24.0 check

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ai,websocket,validation,ui,health]"
          pip install httpx[http2]

      - name: Run tests
        id: tests
        run: pytest tests/ -v --cov=comfy_headless --cov-report=xml --cov-report=term-missing --junitxml=junit.xml

      # The codecov job below uploads what these two steps save; this job
      # never holds an OIDC token. Coverage is saved when the tests passed,
      # and test results whenever they ran, failures included, because a
      # failing test is what that report exists to show. A save step with no
      # file to save fails the job. overwrite lets a re-run of this job
      # replace the artifact its earlier attempt saved.
      - name: Save coverage for Codecov
        if: ${{ env.COVERAGE_LEG == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codecov-coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      - name: Save test results for Codecov
        if: ${{ !cancelled() && env.COVERAGE_LEG == 'true' && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codecov-test-results
          path: junit.xml
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  codecov:
    # Uploads what the test job saved, from a job of its own, so the OIDC
    # token that signs in to Codecov never exists beside the install and the
    # tests. Codecov refuses tokenless uploads to a protected branch, which is
    # what every upload from this repository got before. The checkout, which
    # keeps no token, is there only so Codecov can match report paths to
    # files: the job installs nothing and runs none of the repository's code.
    # It runs whenever the test job ran, failures included, so failing tests
    # still reach Codecov, and only on the events that collect coverage. A
    # run the concurrency group cancels uploads nothing, and each run reads
    # only its own artifacts.
    name: Codecov
    needs: test
    if: ${{ !cancelled() && needs.test.result != 'cancelled' && needs.test.result != 'skipped' && (github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Both artifacts unpack at the root, where the test job wrote them. A
      # pattern that matches nothing, unlike a name, does not fail: a failing
      # test run saves test results and no coverage.
      - name: Download coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codecov-coverage
          path: .

      - name: Download test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codecov-test-results
          path: .

      # After a passing test job both artifacts exist, so each upload runs,
      # and fails the job if its file is missing; after a failing one each
      # runs when its file arrived. Both sign in with OIDC, fail the job when
      # Codecov refuses the report, and run the Codecov CLI at a fixed version
      # rather than whichever is newest.
      - name: Upload coverage to Codecov
        if: ${{ needs.test.result == 'success' || hashFiles('coverage.xml') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: v11.3.1
          use_oidc: true
          fail_ci_if_error: true
          disable_search: true
          files: ./coverage.xml

      - name: Upload test results to Codecov
        if: ${{ needs.test.result == 'success' || hashFiles('junit.xml') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: v11.3.1
          use_oidc: true
          fail_ci_if_error: true
          report_type: test_results
          disable_search: true
          files: ./junit.xml

  pip-audit:
    name: Pip Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Run pip-audit on core dependencies
        run: |
          echo "requests>=2.28.0" > /tmp/core-deps.txt
          echo "tenacity>=8.0.0" >> /tmp/core-deps.txt
          pip-audit -r /tmp/core-deps.txt

      - name: Run pip-audit on full dependencies
        run: |
          pip install -e ".[full]"
          pip-audit
        continue-on-error: true

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --debug --only-verified
